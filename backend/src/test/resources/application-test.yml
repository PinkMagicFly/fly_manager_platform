# ====================================================================
# 翔云·低空智慧物流运营平台 单元测试配置 (test)
# 采用 H2 内存数据库 (MySQL 兼容模式) 实现轻量、快速、确定性的自动化测试
# ====================================================================

spring:
  datasource:
    url: jdbc:h2:mem:soarcloud_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
      encoding: UTF-8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

sa-token:
  token-name: satoken
  timeout: 28800
  active-timeout: 7200
  is-concurrent: true
  is-share: false
  is-read-cookie: true
  is-read-header: true

logging:
  level:
    root: INFO
    com.fly.platform: WARN
