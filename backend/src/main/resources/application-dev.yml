# ====================================================================
# 翔云·低空智慧物流运营平台 开发环境配置 (dev)
# 直连本地 Docker 容器 MySQL 8.0 与 Redis 7 (数据存储于 D:\docker-data)
# ====================================================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/soarcloud_lae?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 10000

  data:
    redis:
      host: localhost
      port: 16379
      timeout: 3000ms

# 日志输出配置
logging:
  level:
    root: INFO
    com.fly.platform: DEBUG
    org.springframework.web: INFO
